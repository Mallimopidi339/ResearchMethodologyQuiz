<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div id="start-screen">
        <h1>📚 Research Quiz Competition</h1>

        <p>
            Module 3 Quiz Competition
        </p>

        <button id="startBtn">Start Quiz</button>
    </div>

    <div id="quiz-screen" style="display:none;">

        <div class="top">

            <h2 id="questionNumber"></h2>

            <div class="timer">
                ⏰ <span id="time">20</span>s
            </div>

        </div>

        <h3 id="question"></h3>

        <div id="options"></div>

        <button id="nextBtn">Next</button>

    </div>

    <div id="result-screen" style="display:none;">

        <h1>🎉 Quiz Completed</h1>

        <h2 id="score"></h2>

        <h3 id="percentage"></h3>

        <h2 id="remark"></h2>

        <button onclick="location.reload()">
            Restart Quiz
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
